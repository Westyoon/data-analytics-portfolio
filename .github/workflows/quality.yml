name: Portfolio QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python examples
        run: python -m compileall -q projects tests
      - name: Run tests
        run: python -m pytest -q
      - name: Run portfolio example
        run: python projects/emergency-medical-capacity/src/qa_validation_example.py
